[mitm]
hostname = %APPEND% *.taobao.com, *.tmall.com, *.alicdn.com, adashbc.ut.taobao.com, ut.taobao.com

[rewrite_local]
# 去除淘宝开屏及应用内弹窗广告
^https?:\/\/(?!.*(?:login|pay|cart|order|search|detail)).*taobao\.com url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/master/RemoveTaobaoAds.js

[filter_local]
# 屏蔽淘宝核心广告与数据统计域名
DOMAIN-SUFFIX,ut.taobao.com,REJECT
DOMAIN,adashbc.ut.taobao.com,REJECT
DOMAIN-SUFFIX,amdc.m.taobao.com,REJECT
DOMAIN-SUFFIX,umeng.com,REJECT
DOMAIN-SUFFIX,umengcloud.com,REJECT
DOMAIN-SUFFIX,bayescom,REJECT
