# 12306 支付宝小程序/App 广告拦截配置
# 更新：新增横幅信息流拦截与兜底净化

[mitm]
hostname = %APPEND% ad.12306.cn, mobile.12306.cn

[rewrite_local]
# 1. 拦截开屏与广告列表请求
^https?:\/\/ad\.12306\.cn\/ad\/ser\/getAdList url reject

# 2. 净化应用内首页横幅与商品信息流（兼容小程序与 App）
^https?:\/\/mobile\.12306\.cn\/otsmobile\/app\/mgs\/mgw\.htm url script-response-body https://raw.githubusercontent.com/myouhi/Surge/master/scripts/12306/12306_remove_ads.js

# 3. 清洗支付宝/通用广告位下发（针对 placementNo 拦截）
^https?:\/\/mobile\.12306\.cn\/otsmobile\/app\/mgs\/mgw\.htm url script-response-body https://raw.githubusercontent.com/lutqhysky/quantumultx/mylove/12306/adk.js

[filter_local]
# 4. 域名级拦截（兜底）
DOMAIN,ad.12306.cn,REJECT
