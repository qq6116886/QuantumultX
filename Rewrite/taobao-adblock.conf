# 淘宝去广告重写配置
# 作者：yourname
# 说明：需开启 MITM 并信任证书；若出现白屏，可先禁用 script 规则测试

[mitm]
hostname = h5api.m.taobao.com, gw.alicdn.com, img.alicdn.com, acs.m.taobao.com, ut.taobao.com

[rewrite_local]

# 1. 图片 / 素材广告域名直接拒绝（轻量、风险低）
^https?:\/\/gw\.alicdn\.com\/.+\.(jpg|png|gif|webp) url reject-img
^https?:\/\/img\.alicdn\.com\/.+ad.+\.(jpg|png|gif|webp) url reject-img

# 2. 推荐流 / 搜索流广告：用 JS 过滤响应体 JSON
^https?:\/\/h5api\.m\.taobao\.com\/h5\/mtop\.relationrecommend\.wirelessrecommend\.recommend script-response-body https://raw.githubusercontent.com/你的GitHub用户名/qx-taobao-adblock/main/taobao-adblock.js

^https?:\/\/h5api\.m\.taobao\.com\/h5\/mtop\.taobao\.search\.search script-response-body https://raw.githubusercontent.com/你的GitHub用户名/qx-taobao-adblock/main/taobao-adblock.js

# 3. 可选的额外追踪 / 统计域名拒绝（不影响核心功能）
^https?:\/\/ut\.taobao\.com\/ url reject-200
^https?:\/\/acs\.m\.taobao\.com\/ url reject-200